<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640">
  <rect width="1100" height="640" fill="#fffdf5"/>
  <!-- 窗口硬阴影 -->
  <rect x="38" y="38" width="1050" height="590" fill="#1c1c1c"/>
  <rect x="26" y="26" width="1050" height="590" fill="#fffdf5" stroke="#1c1c1c" stroke-width="6"/>
  <rect x="29" y="85" width="1044" height="528" fill="#1c1c1c"/>
  <!-- 标题栏 -->
  <line x1="26" y1="82" x2="1076" y2="82" stroke="#1c1c1c" stroke-width="5"/>
  <circle cx="66" cy="54" r="11" fill="#ff90e8" stroke="#1c1c1c" stroke-width="4"/>
  <circle cx="102" cy="54" r="11" fill="#ffd93d" stroke="#1c1c1c" stroke-width="4"/>
  <circle cx="138" cy="54" r="11" fill="#b8f53d" stroke="#1c1c1c" stroke-width="4"/>
  <text x="552" y="62" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="20" font-weight="bold" fill="#1c1c1c">dskts — terminal</text>
  <!-- 终端正文 -->
  <g font-family="Consolas, Menlo, monospace" font-size="23">
    <text x="56" y="140" fill="#b8f53d" font-weight="bold">$</text><text x="82" y="140" fill="#fffdf5" font-weight="bold">dskts up</text>
    <text x="56" y="178" fill="#7ff3ff">keeper 就绪 → 127.0.0.1:3928（登录态常驻，冷启动只此一次）</text>

    <text x="56" y="240" fill="#b8f53d" font-weight="bold">$</text><text x="82" y="240" fill="#fffdf5" font-weight="bold">dskts "Hugo 怎么搭双语站？"</text>
    <text x="56" y="278" fill="#fffdf5" font-style="italic">网页版给出的答案原文 → stdout（过程日志全走 stderr）</text>

    <text x="56" y="340" fill="#b8f53d" font-weight="bold">$</text><text x="82" y="340" fill="#fffdf5" font-weight="bold">dskts --stream "续问一句"</text>
    <text x="56" y="378" fill="#7ff3ff">边生成边打印 · 3 秒一拍增量</text>

    <text x="56" y="440" fill="#b8f53d" font-weight="bold">$</text><text x="82" y="440" fill="#fffdf5" font-weight="bold">dskts --out 答案.md --file 附件.md "带附件问"</text>
    <text x="56" y="478" fill="#7ff3ff">✓ 已写入 答案.md（与 stdout 逐字一致）</text>

    <text x="56" y="540" fill="#b8f53d" font-weight="bold">$</text><text x="82" y="540" fill="#fffdf5" font-weight="bold">dskts status</text>
    <text x="56" y="578" fill="#7ff3ff">管道友好 · 可被脚本与其他 Agent 直接调 · down 整删登录态</text>
  </g>
</svg>
